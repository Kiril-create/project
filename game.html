<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра - КвизБаттл</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-gamepad"></i> КвизБаттл</h1>
            <p class="subtitle">Командная викторина по компьютерным играм</p>
        </header>
        
        <!-- Счёт команд -->
        <div class="score-board">
            <div class="team blue-team" id="teamA">
                <div class="team-header">
                    <i class="fas fa-shield-alt"></i>
                    <h3>Команда Синих</h3>
                </div>
                <div class="score" id="scoreA">0</div>
                <div class="team-turn" id="turnA">
                    <i class="fas fa-user-clock"></i> Сейчас отвечает
                </div>
            </div>
            <div class="vs">
                <div>VS</div>
                <div class="score-total" id="scoreTotal">0:0</div>
            </div>
            <div class="team red-team" id="teamB">
                <div class="team-header">
                    <i class="fas fa-shield-alt"></i>
                    <h3>Команда Красных</h3>
                </div>
                <div class="score" id="scoreB">0</div>
                <div class="team-turn" id="turnB">
                    <i class="fas fa-user-clock"></i> Ждёт очереди
                </div>
            </div>
        </div>
        
        <!-- Индикатор подсказки -->
        <div class="hint-indicator" id="hintIndicator">
            <div class="hint-info">
                <i class="fas fa-lightbulb"></i>
                <span>Подсказка 50/50 доступна</span>
                <div class="hint-counter">1</div>
            </div>
            <button class="hint-use-btn" id="hintUseBtn">
                Использовать
            </button>
        </div>
        
        <!-- Таймер -->
        <div class="timer-container" id="timerContainer">
            <div class="timer-header">
                <i class="fas fa-clock"></i>
                <span>Время на ответ</span>
            </div>
            <div class="timer" id="timer">
                <span class="timer-value" id="timerValue">30</span>
                <span class="timer-seconds">секунд</span>
            </div>
            <div class="timer-progress">
                <div class="timer-bar" id="timerBar"></div>
            </div>
        </div>
        
        <!-- Область с вопросом -->
        <div class="question-area">
            <div class="question-header">
                <div class="question-counter">
                    <i class="fas fa-question-circle"></i>
                    <span>Вопрос <span id="currentQuestion">1</span> из <span id="totalQuestions">20</span></span>
                </div>
                <div class="hint-status" id="hintStatus">
                    <i class="fas fa-percentage"></i>
                    <span>50/50: <span id="hintStatusText">доступна</span></span>
                </div>
            </div>
            
            <div class="question" id="questionText">
                <!-- Вопрос будет загружен через JavaScript -->
            </div>
            
            <!-- Варианты ответов -->
            <div class="answers" id="answersContainer">
                <!-- Кнопки ответов появятся здесь -->
            </div>
        </div>
        
        <div class="game-controls">
            <button class="control-btn restart-btn" id="restartBtn">
                <i class="fas fa-redo"></i> Начать заново
            </button>
            <button class="control-btn home-btn" id="homeBtn">
                <i class="fas fa-home"></i> На главную
            </button>
        </div>
        
        <footer class="game-footer">
            <p><i class="fas fa-info-circle"></i> Кликните на правильный ответ. Подсказка 50/50 убирает 2 неверных варианта</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>

    <script src="js/script.js"></script>
</body>
</html>
